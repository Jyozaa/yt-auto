name: Install Kokoro narration
description: Install pinned Python packages and cache checksummed model files
runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .cache/voice-models/kokoro-v1.0.int8.onnx
          .cache/voice-models/voices-v1.0.bin
        key: kokoro-models-${{ hashFiles('config/voice-models.json') }}
    - shell: bash
      run: |
        python -m pip install --require-hashes -r requirements-voice.txt
        python scripts/voice_assets.py
