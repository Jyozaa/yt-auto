name: Preview render

on:
  workflow_dispatch:
    inputs:
      width:
        description: Preview width in pixels
        type: choice
        required: true
        default: '360'
        options: ['180', '270', '360', '540', '720']

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libnss3 libgbm1 libasound2t64
      - run: npm run preview -- examples/foucault.json --output out/preview
        env:
          PREVIEW_WIDTH: ${{ inputs.width }}
          REMOTION_TMP: ${{ runner.temp }}/yt-auto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: story-preview-${{ github.run_id }}
          path: |
            out/preview/short.mp4
            out/preview/words.json
            out/preview/storyboard.json
            out/preview/qa/
          if-no-files-found: warn
          retention-days: 7
